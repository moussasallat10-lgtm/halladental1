<style>
:root{--bg:#f4efe6;--dot:#d9ccb4;--card:#fff;--ink:#2b2a1a;--mut:#7a755f;--brand:#6f6a3e;--brand2:#8a8450;--soft:#ebe3d3;--line:#e4dac8;--ok:#17855a;--okb:#dff5ea;--wn:#a86610;--wnb:#fdf0d8;--no:#b8372f;--nob:#fbe4e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16150d;--dot:#2a2918;--card:#1f1e12;--ink:#f1ece0;--mut:#b3ac8a;--brand:#b5ad6a;--brand2:#8a8450;--soft:#2e2d1b;--line:#33311f;--ok:#5fd5a0;--okb:#173a2e;--wn:#f0b45a;--wnb:#3d2f14;--no:#f58a82;--nob:#3f1d1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16150d;--dot:#2a2918;--card:#1f1e12;--ink:#f1ece0;--mut:#b3ac8a;--brand:#b5ad6a;--brand2:#8a8450;--soft:#2e2d1b;--line:#33311f;--ok:#5fd5a0;--okb:#173a2e;--wn:#f0b45a;--wnb:#3d2f14;--no:#f58a82;--nob:#3f1d1f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.4px);background-size:32px 32px;min-height:100vh;font-size:16px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:52px;height:52px;border-radius:16px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo img{width:38px;height:38px;object-fit:contain}
header h1{font-size:22px;margin:0;font-weight:800;flex:1;line-height:1.2}
header h1 small{display:block;font-size:13px;font-weight:500;color:var(--mut)}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--card);color:var(--brand);box-shadow:0 4px 14px rgba(111,106,62,.12);min-height:46px}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.btn.sm{padding:8px 14px;min-height:38px;font-size:14px}
.btn:focus-visible,input:focus-visible,select:focus-visible,.pt:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
.panel{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 8px 28px rgba(111,106,62,.1)}
.search{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:13px 16px;font-size:17px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:70vh;overflow:auto}
.pt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:2px solid transparent;background:var(--bg);cursor:pointer;text-align:start;width:100%}
.pt.on{border-color:var(--brand);background:var(--soft)}
.num{background:var(--brand);color:#fff;border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px;flex:none;direction:ltr}
.pt b{display:block;font-size:16px}.pt span.s{font-size:13px;color:var(--mut)}
.chip{border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;white-space:nowrap;margin-inline-start:auto}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.wn{background:var(--wnb);color:var(--wn)}.chip.no{background:var(--nob);color:var(--no)}
.hero{border-radius:24px;padding:22px;color:#fff;background:linear-gradient(135deg,#6f6a3e,#8a8450)}
.hero h2{margin:8px 0 4px;font-size:26px;font-weight:800}
.hero p{margin:2px 0;opacity:.9;font-size:15px}
.hero .num{background:#fff;color:#6f6a3e}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--bg);border-radius:16px;padding:12px}
.stat small{color:var(--mut);display:block;font-size:13px}.stat b{font-size:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.visit{border:2px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}
.visit h4{margin:0 0 4px;font-size:17px}
.vm{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:14px}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.back{display:none;margin-bottom:12px}
#lock{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;background:var(--bg)}body.locked .wrap{display:none}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.bookc{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;box-shadow:0 6px 18px rgba(111,106,62,.4);z-index:5}body.locked .bookc{display:none!important}
h4.sec{margin:18px 0 0;font-size:17px}
.alert{background:var(--nob);color:var(--no);border:2px solid var(--no);border-radius:16px;padding:12px 14px;font-weight:800;margin-bottom:12px}
#bkc{display:none;position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:26px;box-shadow:0 8px 24px rgba(111,106,62,.4);cursor:pointer;z-index:20}
#bkn{position:absolute;top:-4px;inset-inline-end:-4px;background:#d9534f;color:#fff;border-radius:999px;min-width:22px;height:22px;font-size:13px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 5px}
@media print{#bkc{display:none!important}}
.logo,.stat,.num{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{.bookc{display:none!important}}
header{flex-wrap:wrap}header h1{flex:1 1 130px}header .btn{padding:8px 14px;min-height:40px;font-size:14px}
dialog{border:0;border-radius:24px;padding:20px;width:min(480px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,19,10,.55)}
dialog h3{margin:0 0 12px;font-size:20px}
label{display:block;font-size:14px;font-weight:700;margin:10px 0 4px}
input,select{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 14px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.err{color:var(--no);font-size:14px;margin-top:8px;min-height:20px}
.foot{margin-top:16px;color:var(--mut);font-size:13px;text-align:center}
.copy{margin:8px 0 12px;padding-top:12px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;text-align:center;line-height:1.9}.copy div:last-child{font-weight:700;color:var(--brand)}@media print{.copy{display:none}}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:start}
@media print{.wrap{display:none}dialog{position:static;box-shadow:none;width:100%}.noprint{display:none}}
@media (max-width:900px){
 .grid{grid-template-columns:1fr}
 .grid.sel #listp{display:none}.grid:not(.sel) #detail{display:none}
 .back{display:inline-block}.list{max-height:none}
}
@media (max-width:480px){.two{grid-template-columns:1fr}header h1{font-size:19px}.btn{padding:10px 14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:8px 0 14px}
.ith{border:0;padding:0;border-radius:14px;overflow:hidden;background:var(--soft);cursor:pointer;display:flex;flex-direction:column;text-align:center;color:var(--mut);font-size:11px}
.ith img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--soft)}
.ith span{padding:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ith.bad img{visibility:hidden}
body{background:linear-gradient(180deg,#e3dcc4 0,#f4efe6 300px) fixed;background-image:none}

<script>
(function(){
/* ===== الإعداد: ألصق بين علامتي الاقتباس رابط جوجل شيت وكلمة السر ===== */
var DOCS=['د. يوسف المحمد','د. نبهان السيد علي']; // أسماء الأطباء
var BOOKINGS=true; // الحجوزات في ملف وسكربت منفصلين، والسجل يقرأ منهما فقط
var API='https://script.google.com/macros/s/AKfycbxDkp7m-mN0uo6HD2EvrwhCcobUKp_lDWvNFGr1Ejq4a5_7w5G_PXCPSnL509etyG5n/exec'; // ألصق هنا رابط سكربت السجل (Web App) بعد النشر
var KEY='';
var BOOK_URL=''; // رابط موقع الحجوزات (الدائرة الزرقاء الجانبية). اتركه فارغاً لإخفائها
/* ===================================================================== */
var P={},sel=null,col=null,LS='hala_clinic_patients',PEND='hala_pending',home=window.innerWidth>900,LANG='ar',ROLE='admin',PERMS=[],USER='';
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(v);return isNaN(n)||n<0?0:n}
function fmt(n){return Number(n).toLocaleString('en-US')}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nowT(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function dayName(d){try{return new Date(d+'T00:00').toLocaleDateString(LANG==='en'?'en':'ar',{weekday:'long'})}catch(e){return''}}
function paySum(p){var s=0;(p.payments||[]).forEach(function(x){s+=x.amount});return s}
function eff(p){var pool=paySum(p),vs=(p.visits||[]).slice().sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)});return vs.map(function(v){var need=Math.max(0,v.total-v.paid),a=Math.min(need,pool);pool-=a;return Object.assign({},v,{ep:v.paid+a})})}
function totals(p){var t=0,d=paySum(p);(p.visits||[]).forEach(function(v){t+=v.total;d+=v.paid});return{t:t,d:d,r:Math.max(0,t-d)}}
function status(v){var pp=v.ep!=null?v.ep:v.paid,r=v.total-pp;if(r<=0)return['ok','مدفوع كامل'];if(pp>0)return['wn','مدفوع جزئي'];return['no','غير مدفوع']}

/* storage: shared db when available, otherwise this browser only */
function loadLocal(){try{var s=localStorage.getItem(LS);if(s)P=JSON.parse(s)||{}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}}
function persist(p){if(p.trash)p.trash=p.trash.filter(function(x){return Date.now()-x.at<2592e6});
 P[p.id]=p;
 if(API){saveLocal();push(p)}
 else if(col){col.doc(p.id).set(p).catch(function(){$('foot').textContent='تعذر الحفظ على الخادم، تحقق من الصلاحيات.'})}
 else saveLocal();
 render();
}
function note(m,bad){var f=$('foot');f.textContent=m;f.style.color=bad?'var(--no)':''}
function pend(){try{return JSON.parse(localStorage.getItem(PEND)||'[]')}catch(e){return[]}}
function setPend(a){try{localStorage.setItem(PEND,JSON.stringify(a))}catch(e){}}
function send(p){return fetch(API,{method:'POST',body:JSON.stringify({name:UNAME,key:KEY,patient:p})}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw 0})}
function push(p){var a=pend();if(a.indexOf(p.id)<0){a.push(p.id);setPend(a)}flush()}
function flush(){var a=pend();if(!a.length){note('تم الحفظ في جوجل شيت ✓');return Promise.resolve()}
 note('جارٍ الحفظ…');var id=a[0];
 return send(P[id]).then(function(){setPend(pend().filter(function(x){return x!==id}));return flush()}).catch(function(){note('لم يُحفظ بعد. تحقق من الإنترنت، وسيُعاد الحفظ تلقائياً.',1)})}
function startApi(){note('جارٍ تحميل السجلات…');
 fetch(loginUrl(UNAME,KEY)).then(function(r){return r.json()}).then(function(j){
  if(!j.patients)throw 0;var m={};j.patients.forEach(function(p){m[p.id]=p});
  if(!j.patients.length&&Object.keys(P).length){setPend(Object.keys(P))}
  pend().forEach(function(id){if(P[id])m[id]=P[id]});
  P=m;saveLocal();if(sel&&!P[sel])sel=null;render();return flush()
 }).catch(function(){note('تعذر الاتصال بجوجل شيت (تأكد من الرابط وكلمة السر). تظهر النسخة المحفوظة على الجهاز.',1)})}
function nextId(){var m=1000;Object.keys(P).forEach(function(k){var n=parseInt(k,10);if(n>m)m=n});return String(m+1)}

/* list */
function renderList(){
 var q=$('q').value.trim().toLowerCase(),arr=Object.keys(P).map(function(k){return P[k]});
 var so=$('sortb').value,lv=function(p){var l='';(p.visits||[]).forEach(function(v){if(v.date>l)l=v.date});(p.payments||[]).forEach(function(x){if(x.date>l)l=x.date});return l};
 arr.sort(function(a,b){if(so==='v')return lv(b).localeCompare(lv(a));if(so==='d')return totals(b).r-totals(a).r;return parseInt(b.id,10)-parseInt(a.id,10)});
 if(q){var parts=q.split(/\s+/);arr=arr.filter(function(p){var h=(p.id+' '+p.first+' '+p.last+' '+(p.father||'')+' '+(p.mother||'')+' '+(p.phone||'')).toLowerCase();return parts.every(function(w){return h.indexOf(w)>-1})})}
 if(!arr.length){$('list').innerHTML='<div class="empty">'+(Object.keys(P).length?'لا يوجد مريض بهذا الاسم أو الرقم':'لا يوجد مرضى بعد. اضغط «مريض جديد» لتسجيل أول مريض.')+'</div>';return}
 $('list').innerHTML=arr.map(function(p){var t=totals(p);
  return '<button class="pt'+(p.id===sel?' on':'')+'" data-id="'+esc(p.id)+'"><span class="num">'+esc(p.id)+'</span><span><b>'+esc(p.first)+' '+esc(p.last)+'</b><span class="s">'+(p.age?esc(p.age)+' سنة':'')+(p.visits&&p.visits.length?' · '+p.visits.length+' زيارة':'')+'</span></span>'+(t.r>0?'<span class="chip no">عليه '+fmt(t.r)+'</span>':'')+'</button>'}).join('');
}

/* detail */
var CC=[['سوريا','963'],['تركيا','90'],['لبنان','961'],['الأردن','962'],['فلسطين','970'],['العراق','964'],['السعودية','966'],['الإمارات','971'],['الكويت','965'],['قطر','974'],['البحرين','973'],['عُمان','968'],['اليمن','967'],['مصر','20'],['ليبيا','218'],['تونس','216'],['الجزائر','213'],['المغرب','212'],['السودان','249'],['ألمانيا','49'],['السويد','46'],['هولندا','31'],['فرنسا','33'],['بريطانيا','44'],['أمريكا وكندا','1']];
function ccOpts(c){c=c||'963';return CC.map(function(x){return '<option value="'+x[1]+'"'+(c===x[1]?' selected':'')+'>'+x[0]+' (+'+x[1]+')</option>'}).join('')}
function fullPhone(p){var cc=p.cc||'963',d=(p.phone||'').replace(/\D/g,'').replace(/^0+/,'');if(!d)return '';return (d.indexOf(cc)===0&&d.length>=cc.length+8)?d:cc+d}
function report(){
 open('<h3>التقرير الشهري</h3><input id="rm" type="month" value="'+today().slice(0,7)+'"><div id="rb"></div><div class="row noprint" style="margin-top:12px"><button class="btn pri" id="pr">طباعة</button><button class="btn" id="cx">إغلاق</button></div>');
 $('pr').onclick=function(){window.print()};$('cx').onclick=function(){dlg.close()};
 var draw=function(){
  var m=$('rm').value,vc=0,bill=0,col=0,ps={},days={};
  var D=function(d){return days[d]||(days[d]={v:0,c:0})};
  Object.keys(P).forEach(function(k){var p=P[k];
   (p.visits||[]).forEach(function(v){if((v.date||'').slice(0,7)===m){vc++;bill+=v.total;col+=v.paid;ps[p.id]=1;var o=D(v.date);o.v++;o.c+=v.paid}});

/* export (CSV opens in Google Sheets or Excel) */
function csvCell(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCsv(){
 var rows=[['رقم المريض','الاسم','العائلة','الأب','الأم','العمر','الهاتف','التاريخ','الوقت','الشغل','المبلغ','المدفوع','المتبقي','الحالة']];
 Object.keys(P).sort(function(a,b){return a-b}).forEach(function(k){var p=P[k],base=[p.id,p.first,p.last,p.father,p.mother,p.age,p.phone];
  if(!(p.visits||[]).length)rows.push(base.concat(['','','','','','','']));
  eff(p).forEach(function(v){rows.push(base.concat([v.date,v.time,v.work,v.total,v.ep,v.total-v.ep,status(v)[1]]))})});
 var data='\uFEFF'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\n');
 var fn='hala-smile-patients-'+today()+'.csv';
 var local=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()};
 if(!(window.claude&&claude.use)){local();return}
 claude.use('downloads').then(function(d){if(!d){local();return}return d.save({filename:fn,data:data})}).catch(function(){});
}
